
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pytest pytest-asyncio anyio transformers fastapi httpx pydantic

      - name: Allocator, scheduler and prefix-cache tests
        run: |
          python -m pytest -q \
            tests/test_block_allocator.py \
            tests/test_scheduler_continuous_batching.py \
            tests/test_paged_attention_prefix_cache.py \
            tests/test_async_engine.py

      - name: Reference attention (CPU cases only)
        run: |
          python -m pytest -q tests/test_paged_attention_reference.py \
            -k "not triton and not gpu"